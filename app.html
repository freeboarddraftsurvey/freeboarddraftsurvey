.fb{--bg:#0F1A24;--panel:#162532;--panel2:#1C2F3F;--line:#2A4053;--ink:#E4EAEF;--mute:#8BA0B2;--amber:#F2B33D;--green:#6CC39A;--red:#E2574C;--sea:#2D6E8E;--well:#0B141C;--deep:#13212D;--hl:#3a2f12;--zebra:#132230;--card2:#22384B;
 font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;max-width:520px;margin:0 auto;position:relative;padding-bottom:108px;font-size:15px}
.fb *{box-sizing:border-box}

.fb .big{font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;font-size:40px;font-weight:700;color:var(--green);line-height:1}

.fb .nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;display:flex;align-items:flex-end;background:var(--deep);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:6;padding:6px 4px 8px}
.fb .navb{flex:1;background:none;border:0;border-radius:0;color:var(--mute);padding:4px 2px 0;font-size:12px;font-weight:600;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;gap:3px}

.fb .navb.raised.on .ib{background:linear-gradient(160deg,#F7C25A,#D9941C);border-color:#F2B33D;color:#1A1205;box-shadow:0 8px 20px rgba(242,179,61,.35)}

.fb .tile .ti{color:var(--amber);width:26px;height:26px;margin-bottom:8px}

.doc.compact .result{margin-top:9px;padding:7px 12px}
.doc.compact .sigs{margin-top:10px}
.doc .result{border:2px solid #12324a;margin-top:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.doc .result b{font-size:20px;color:#12324a}
.doc .remarks{border:1px solid #9aa6b1;min-height:42px;padding:6px 8px;white-space:pre-line}
.doc .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;break-inside:avoid}
.doc .sig{border:1px solid #9aa6b1;padding:8px;break-inside:avoid}
.doc .sigArea{display:flex;align-items:flex-end;gap:6px;height:84px}
.doc .sigArea .s{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #333}
.doc .sigArea .s img{max-height:78px;max-width:100%}
.doc .sigArea .st{width:78px;height:78px;display:flex;align-items:center;justify-content:center;border:1px dashed #b8c2cb;color:#9aa6b1;font-size:9px;text-align:center}
.doc .sigArea .st img{max-width:78px;max-height:78px;opacity:.92}
.doc .sig .nm{font-weight:bold;margin-top:5px;min-height:14px}.doc .sig .ds{color:#444}
.doc .foot{margin-top:16px;border-top:1px solid #c5cdd4;padding-top:6px;color:#666;font-size:9px;display:flex;justify-content:space-between}
.doc tr,.doc .result,.doc .remarks{break-inside:avoid}
@page{size:A4;margin:10mm}
@media print{
 html,body{background:#fff!important;margin:0!important}
 .fb{background:#fff!important;min-height:0!important;padding:0!important;max-width:none!important}
 .fb > *:not(.docWrap),.fb .docBar{display:none!important}
 .fb .docWrap{position:static!important;padding:0!important;background:#fff!important;overflow:visible!important}
 .doc{width:100%!important;box-shadow:none!important;padding:0!important;margin:0!important;zoom:1!important}
 .doc th,.doc h3,.doc td.l,.doc tr.tot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
